# DigitalOcean App Platform spec for Gotchiverse REALM (Colyseus + HTTP BFF) — this repo.
#
# The live app (`gotchiverse-realm`, realm.aarcadeghst.com) was created from
# gotchiverse-2d/.do/app.yaml (source_dir infra/realm-server). To move it to this repo
# without losing its existing secrets, run scripts/deploy-do-app.sh (patches the live
# spec in place). This file is the reference for a fresh `doctl apps create --spec`.
#
# Requires the DO account's GitHub integration to have access to
# userdefault13/gotchiverse-realm-server (App Platform → Settings → GitHub).

name: gotchiverse-realm
region: nyc

services:
  - name: realm
    github:
      repo: userdefault13/gotchiverse-realm-server
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: Dockerfile
    http_port: 2567
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 15
      period_seconds: 20
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 4
    envs:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "2567"
      - key: PUBLIC_URL
        value: https://realm.aarcadeghst.com
      - key: CORS_ORIGINS
        value: "https://gotchiverse-2d.xyz,https://www.gotchiverse-2d.xyz,https://gotchiverse-2d.vercel.app,https://*.vercel.app,http://localhost:3001,http://127.0.0.1:3001"
      - key: JWT_SECRET
        type: SECRET
        value: "replace-via-deploy-script"
      - key: JWT_TTL_SECONDS
        value: "86400"
      - key: CORE_SUBGRAPH_URL
        value: https://aarcadeghst.com/api/subgraph/aavegotchi-core-base
      - key: GOTCHIVERSE_SUBGRAPH_URL
        value: https://aarcadeghst.com/api/subgraph/gotchiverse-base
      - key: SKIP_OWNERSHIP_CHECK
        value: "true"
      - key: COMBAT_IS_LIVE
        value: "true"
      # Aarcade cartridge-sim (KO pocket prizes) — secret set via deploy script
      - key: AARCADE_CARTRIDGE_SIM_URL
        value: https://aarcadeghst.com/api/cartridge-sim
      - key: AARCADE_POCKET_CREDIT_SECRET
        type: SECRET
        value: "replace-via-deploy-script"
      # Agent as Player (aCartridge) — docs/ACARTRIDGE_DIAMOND_PLAN.md in AarcadeGh-t
      - key: AARCADE_ACARTRIDGE_URL
        value: https://aarcadeghst.com/api/acartridge
      - key: ACARTRIDGE_GAME_ID
        value: gotchiverse-base
      - key: ACARTRIDGE_DIAMOND
        value: "0x8fB6DD5Cef4521E01cCAb178B84eE1392CdB1232"
      - key: ACARTRIDGE_CHAIN_ID
        value: "84532"
      - key: ACARTRIDGE_ATTESTOR_SECRET
        type: SECRET
        value: "replace-via-deploy-script"
      - key: ACARTRIDGE_ATTESTOR_PRIVATE_KEY
        type: SECRET
        value: "replace-via-deploy-script"
